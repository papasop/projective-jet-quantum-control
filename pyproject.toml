[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "projective-jet-quantum-control"
version = "0.1.0"
description = "Projective-jet quantum control and response-fibre audit experiments"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
  "numpy>=1.23",
  "pandas>=1.5",
]

[project.optional-dependencies]
dev = [
  "pytest>=7.0",
]
openai = [
  "openai>=1.0",
]

[project.scripts]
slf-experiment = "lgr_experiment.cli:main"
lgr-experiment = "lgr_experiment.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
